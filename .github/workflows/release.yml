name: Release

# Push a tag like v1.0.0 to build downloads for Windows, macOS and Linux and
# attach them to a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: LostArkTracker-windows.exe
            binary: dist/LostArkTracker.exe
          - os: macos-latest
            asset: LostArkTracker-macos
            binary: dist/LostArkTracker
          - os: ubuntu-latest
            asset: LostArkTracker-linux
            binary: dist/LostArkTracker
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Stamp version from tag
        shell: bash
        run: sed -i.bak "s/^APP_VERSION = .*/APP_VERSION = \"${GITHUB_REF_NAME#v}\"/" backend/version.py

      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: backend
      - run: python build.py

      # Start the real binary and make sure it serves the API and the page,
      # at the version stamped from the tag, before anything is uploaded.
      - name: Smoke-test the binary
        shell: bash
        run: python scripts/smoke_test.py "${{ matrix.binary }}" --expect-version "${GITHUB_REF_NAME#v}"

      - name: Rename binary
        shell: bash
        run: mv "${{ matrix.binary }}" "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The release notes are the annotated tag's message (see the release
      # skill). Checkout can leave the tag without its annotation, so fetch it.
      - name: Notes from the tag message
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l "${GITHUB_REF_NAME}" --format='%(contents)' > release-notes.md
          cat release-notes.md
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          body_path: release-notes.md
          generate_release_notes: true
