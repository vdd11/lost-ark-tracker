name: Release

# Push a tag like v1.0.0 to build downloads for Windows, macOS and Linux and
# attach them to a GitHub release.
on:
  push:
    tags: ["v*"]

# Only the job that publishes the release can write.
permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: LostArkTracker-windows.exe
            binary: dist/LostArkTracker.exe
          - os: macos-latest
            asset: LostArkTracker-macos
            binary: dist/LostArkTracker
          - os: ubuntu-latest
            asset: LostArkTracker-linux
            binary: dist/LostArkTracker
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Stamp version from tag
        shell: bash
        run: sed -i.bak "s/^APP_VERSION = .*/APP_VERSION = \"${GITHUB_REF_NAME#v}\"/" backend/version.py

      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: backend
      - run: python build.py

      # Start the real binary and make sure it serves the API and the page,
      # at the version stamped from the tag, before anything is uploaded.
      - name: Smoke-test the binary
        shell: bash
        run: python scripts/smoke_test.py "${{ matrix.binary }}" --expect-version "${GITHUB_REF_NAME#v}"

      - name: Rename binary
        shell: bash
        run: mv "${{ matrix.binary }}" "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The release notes are the annotated tag's message (see the release
      # skill). Checkout can leave the tag without its annotation, so fetch it.
      - name: Notes from the tag message
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l "${GITHUB_REF_NAME}" --format='%(contents)' > release-notes.md
          cat release-notes.md
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: assets
          merge-multiple: true
      # The in-app "Update now" only installs a download that matches these.
      - name: Checksums
        run: |
          cd assets
          sha256sum LostArkTracker-* > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: assets/*
          body_path: release-notes.md
          generate_release_notes: true
          # A draft: the app's update check can't see it until
          # scripts/sign_release.py has signed SHA256SUMS (with a key that
          # never comes to GitHub) and published it.
          draft: true
